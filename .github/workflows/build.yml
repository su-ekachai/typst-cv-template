name: Build Resume and Cover Letter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Setup data from examples
        run: |
          for f in data/*.example.toml; do
            cp "$f" "${f%.example.toml}.toml"
          done

      - name: Compile documents
        run: |
          mkdir -p output
          typst compile --root . src/resume.typ output/resume.pdf
          typst compile --root . src/cover_letter.typ output/cover_letter.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: cv-documents
          path: output/*.pdf
          retention-days: 30
